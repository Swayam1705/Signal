name: keep-alive

on:
  schedule:
    # Every 5 minutes, 24/7 - keeps the Railway free-tier container awake
    # so first queries after idle don't hit a cold start during the demo.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SIGNAL backend health endpoint
        run: |
          curl -sf -o /dev/null -m 30 \
            https://signal-production-9bd4.up.railway.app/api/health \
            || echo "::warning::Railway health check failed (may be mid-restart)"
