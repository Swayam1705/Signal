services:
  backend:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      QDRANT_PATH: /app/data/index/qdrant
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

