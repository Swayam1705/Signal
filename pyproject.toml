[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signal"
version = "1.0.0"
description = "Voice-Enabled Retrieval-Augmented Generation (RAG) System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.8.0",
    "numpy>=1.26.0",
    "sentence-transformers>=2.7.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]